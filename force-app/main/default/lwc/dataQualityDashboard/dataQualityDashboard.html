<template>
    <lightning-card title="Data Quality Dashboard" icon-name="custom:custom9">
        <div class="slds-m-around_medium">
            <!-- Statistics Section -->
            <div class="slds-grid slds-wrap slds-gutters">
                <div class="slds-col slds-size_1-of-3">
                    <lightning-card title="Total Issues">
                        <div class="slds-text-heading_large slds-text-align_center slds-p-around_medium">
                            {totalIssuesCount}
                        </div>
                    </lightning-card>
                </div>
                <div class="slds-col slds-size_1-of-3">
                    <lightning-card title="Critical Priority">
                        <div class="slds-text-heading_large slds-text-align_center slds-p-around_medium critical-color">
                            {criticalCount}
                        </div>
                    </lightning-card>
                </div>
                <div class="slds-col slds-size_1-of-3">
                    <lightning-card title="Fixed Issues">
                        <div class="slds-text-heading_large slds-text-align_center slds-p-around_medium success-color">
                            {fixedCount}
                        </div>
                    </lightning-card>
                </div>
            </div>

            <!-- Filters Section -->
            <lightning-card title="Filters" class="slds-m-top_medium">
                <div class="slds-grid slds-wrap slds-gutters slds-p-around_small">
                    <div class="slds-col slds-size_1-of-3">
                        <lightning-combobox
                            label="Object Type"
                            placeholder="All Objects"
                            value={selectedObjectType}
                            options={objectTypeOptions}
                            onchange={handleObjectTypeChange}
                        ></lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-3">
                        <lightning-combobox
                            label="Priority"
                            placeholder="All Priorities"
                            value={selectedPriority}
                            options={priorityOptions}
                            onchange={handlePriorityChange}
                        ></lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-3">
                        <lightning-combobox
                            label="Status"
                            placeholder="All Statuses"
                            value={selectedStatus}
                            options={statusOptions}
                            onchange={handleStatusChange}
                        ></lightning-combobox>
                    </div>
                </div>
                <div class="slds-text-align_center slds-p-around_small">
                    <lightning-button
                        label="Apply Filters"
                        variant="brand"
                        onclick={handleApplyFilters}
                    ></lightning-button>
                    <lightning-button
                        label="Clear Filters"
                        variant="neutral"
                        onclick={handleClearFilters}
                        class="slds-m-left_small"
                    ></lightning-button>
                </div>
            </lightning-card>

            <!-- Issues Table -->
            <lightning-card title="Data Quality Issues" class="slds-m-top_medium">
                <template if:true={loading}>
                    <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                </template>
                <template if:false={loading}>
                    <template if:true={hasIssues}>
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th scope="col">
                                        <div class="slds-truncate" title="Issue Number">Issue Number</div>
                                    </th>
                                    <th scope="col">
                                        <div class="slds-truncate" title="Object Type">Object Type</div>
                                    </th>
                                    <th scope="col">
                                        <div class="slds-truncate" title="Field Name">Field Name</div>
                                    </th>
                                    <th scope="col">
                                        <div class="slds-truncate" title="Error Message">Error Message</div>
                                    </th>
                                    <th scope="col">
                                        <div class="slds-truncate" title="Priority">Priority</div>
                                    </th>
                                    <th scope="col">
                                        <div class="slds-truncate" title="Status">Status</div>
                                    </th>
                                    <th scope="col">
                                        <div class="slds-truncate" title="Detected Date">Detected Date</div>
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={issues} for:item="issue">
                                    <tr key={issue.Id}>
                                        <td>
                                            <lightning-formatted-text value={issue.Name}></lightning-formatted-text>
                                        </td>
                                        <td>
                                            <lightning-formatted-text value={issue.Object_Type__c}></lightning-formatted-text>
                                        </td>
                                        <td>
                                            <lightning-formatted-text value={issue.Field_Name__c}></lightning-formatted-text>
                                        </td>
                                        <td>
                                            <lightning-formatted-text value={issue.Error_Message__c}></lightning-formatted-text>
                                        </td>
                                        <td>
                                            <lightning-badge label={issue.Priority__c}></lightning-badge>
                                        </td>
                                        <td>
                                            <lightning-badge label={issue.Status__c}></lightning-badge>
                                        </td>
                                        <td>
                                            <lightning-formatted-date-time value={issue.Detected_Date__c}></lightning-formatted-date-time>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </template>
                    <template if:false={hasIssues}>
                        <div class="slds-text-align_center slds-p-around_large">
                            <p class="slds-text-body_regular">No data quality issues found.</p>
                        </div>
                    </template>
                </template>
            </lightning-card>

            <!-- Toast for Success/Error Messages -->
            <template if:true={showToast}>
                <div class="slds-notify_container slds-is-relative">
                    <div class={toastClass} role="status">
                        <span class="slds-assistive-text">{toastVariant}</span>
                        <h2>{toastMessage}</h2>
                    </div>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
